# Install as .github/workflows/governed-ci.yml in the consumer repository.
# Change the tag only after publishing that version in Engineering Governance.
name: Project CI (Governance router)

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      stage:
        description: "Default: plan only. Select focused and enter a test ID to execute a specific lane."
        type: choice
        required: true
        default: none
        options: [focused, milestone, ready, release, none]
      focused_test:
        description: "Catalog ID (required when stage=focused)"
        type: string
        required: false
      comparison_base:
        description: "Required accepted-branch commit SHA for manual ready/milestone scope"
        type: string
        required: false

permissions:
  contents: read

jobs:
  governed:
    # Draft changes do not launch tests or consume self-hosted runner time.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: Lost0rz/Engineering-Governance/.github/workflows/ci-router-reusable.yml@v0.10.0
    with:
      capabilities_path: .github/ci-capabilities.json
      stage: ${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'auto' }}
      focused_test: ${{ inputs.focused_test || '' }}
      comparison_base: ${{ inputs.comparison_base || '' }}
