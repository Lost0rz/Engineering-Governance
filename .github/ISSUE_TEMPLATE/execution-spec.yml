name: Deterministic execution spec
description: Detailed construction plan; requires authenticated approval of the exact digest before execution.
title: "[EXECUTION] "
body:
  - type: markdown
    attributes:
      value: |
        Complete all fields with **verified, concrete** evidence and detailed Work Packages.
        Form required-fields alone are not approval: an authorized user must post
        SPEC_APPROVAL_V1 with SHA256 from the bundled validator for this issue.
        A local executor may not guess missing files, APIs, tests or design decisions.
  - type: dropdown
    id: contract
    attributes:
      label: CONTRACT
      description: "Execution contract identifier"
      options:
        - EXECUTION_SPEC_V1
    validations:
      required: true
  - type: input
    id: task_id
    attributes:
      label: TASK_ID
      description: "Stable task identity, preserve across contexts"
      placeholder: "EG-PROJECT-TASK-001"
    validations:
      required: true
  - type: input
    id: spec_revision
    attributes:
      label: SPEC_REVISION
      description: "Positive integer, bump for every approved body change"
      placeholder: "1"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: MODE
      description: "Current issue template permits only bounded source execution"
      options:
        - EXECUTE
    validations:
      required: true
  - type: input
    id: purpose
    attributes:
      label: PURPOSE
      description: "Specific engineering task purpose, e.g. BOUNDED_CORRECTIVE"
      placeholder: "BOUNDED_CORRECTIVE"
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: OBJECTIVE
      description: "One observable engineering outcome"
      placeholder: "Implement precisely the accepted behavior."
    validations:
      required: true
  - type: textarea
    id: verified_baseline
    attributes:
      label: VERIFIED_BASELINE
      description: "Actual inspected main/ref, file/symbol/API evidence; UNKNOWN means cannot execute"
      placeholder: "repo main SHA; paths, functions and verified observations"
    validations:
      required: true
  - type: textarea
    id: target_behavior
    attributes:
      label: TARGET_BEHAVIOR
      description: "Positive and negative observable acceptance claims"
      placeholder: "Expected behavior and forbidden regressions"
    validations:
      required: true
  - type: textarea
    id: in_scope
    attributes:
      label: IN_SCOPE
      description: "Explicit allowed components and semantics"
      placeholder: "Only the listed module changes"
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: OUT_OF_SCOPE
      description: "Explicit exclusions"
      placeholder: "No schema or unrelated feature changes"
    validations:
      required: true
  - type: textarea
    id: allowed_side_effects
    attributes:
      label: ALLOWED_SIDE_EFFECTS
      description: "Permitted source, workspace, API or data mutations"
      placeholder: "Existing Draft PR, specified file edits"
    validations:
      required: true
  - type: textarea
    id: canonical_authorities
    attributes:
      label: CANONICAL_AUTHORITIES
      description: "Accepted design, API, schema and AGENTS pointers"
      placeholder: "AGENTS.md, source evidence, approved design"
    validations:
      required: true
  - type: textarea
    id: work_packages
    attributes:
      label: WORK_PACKAGES
      description: "Concrete ordered WP(s); use #### WP01 and each mandatory action key"
      placeholder: |
        #### WP01 — scoped code change
        Targets: actual verified file/function/interface
        Preconditions: checked revision, dependencies, writable workspace
        Actions: (1) exact edit (2) exact integration
        Dependencies: NONE or specified WP
        Edge cases: error handling and backwards compatibility
        Verification: focused command and observable expected result
        Done: specific PASS criterion
    validations:
      required: true
  - type: textarea
    id: verification_plan
    attributes:
      label: VERIFICATION_PLAN
      description: "State the governance authority/effects ceiling G0-G3 separately from verification evidence tier V0-V3; list focused checks, cadence and live host gates"
      placeholder: "G2 authority ceiling; V3 independent security/concurrency evidence; exact-head PR host gate"
    validations:
      required: true
  - type: textarea
    id: human_ui_acceptance
    attributes:
      label: HUMAN_UI_ACCEPTANCE
      description: "PENDING or NOT_REQUIRED: explicit non-product-UI rationale"
      placeholder: "PENDING"
    validations:
      required: true
  - type: textarea
    id: deviation_policy
    attributes:
      label: DEVIATION_POLICY
      description: "L0 CONTINUE, L1 LOCAL_CORRECT, L2 PAUSE_AND_ASK, L3 TERMINATE within the approved objective/risk/effect envelope; new autonomy never activates from a comment or local snapshot"
      placeholder: "L0 equivalent locator; L1 same-scope fix; L2 permission or target expansion; L3 revoked grant or destructive write"
    validations:
      required: true
  - type: textarea
    id: stop_and_safety
    attributes:
      label: STOP_AND_SAFETY
      description: "Specific unapproved/destructive/permission/dependency stop criteria"
      placeholder: "New schema or unverified authority -> PAUSE"
    validations:
      required: true
  - type: textarea
    id: return_contract
    attributes:
      label: RETURN_CONTRACT
      description: "Expected issue receipt content and PR/CI evidence"
      placeholder: "EXECUTION_RECEIPT_V1 comment to this Issue; link PR"
    validations:
      required: true
  - type: textarea
    id: authorization_basis
    attributes:
      label: AUTHORIZATION_BASIS
      description: "Not self-approval. Explicit approver comment with SHA256 is required after authoring."
      placeholder: "PENDING — trusted SPEC_APPROVAL_V1 GitHub comment"
    validations:
      required: true
