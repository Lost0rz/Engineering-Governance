name: Release Plugin v0.7.1

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - plugin.json
      - skills/**
      - references/V071_DESIGN_ROUTING_HARDENING_ACCEPTANCE.md
      - references/V070_DESIGN_MULTI_MODULE_ACCEPTANCE.md
      - .github/workflows/release-plugin-v0.7.1.yml
      - .github/workflows/release-plugin-v0.7.0.yml
  push:
    branches:
      - main
    paths:
      - plugin.json
      - skills/**
      - references/V071_DESIGN_ROUTING_HARDENING_ACCEPTANCE.md
      - .github/workflows/release-plugin-v0.7.1.yml
      - .github/workflows/release-plugin-v0.7.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          manifest = json.loads(Path('plugin.json').read_text())
          assert manifest['name'] == 'engineering-governance'
          assert manifest['version'] == '0.7.1'

          expected = {
              'project-governance',
              'project-profile',
              'solution-design',
              'design',
              'execution-orchestrator',
              'agent-handoff',
              'evidence-audit',
              'domain-navigation',
              'incident-doctor',
          }
          actual = {p.name for p in Path('skills').iterdir() if p.is_dir()}
          assert actual == expected, (actual, expected)
          for skill in sorted(expected):
              assert (Path('skills') / skill / 'SKILL.md').is_file(), skill

          # Preserve prior governance gates.
          profile = Path('skills/project-profile/SKILL.md').read_text()
          assert 'Mandatory pre-return compliance gate' in profile
          assert 'AUTHORITY_MAP_POINTER_ONLY_WHEN_DOMAIN_AUTHORITY_EXISTS' in profile

          governance = Path('skills/project-governance/SKILL.md').read_text()
          for marker in (
              '## Evidence-triggered composition',
              'UNRESOLVED_DEPENDENCY:',
              'DECISION_IMPACT:',
              'CAPABILITY:',
              'EXPECTED_RETURN:',
              'RESUME_OWNER_OR_STAGE:',
              'Mandatory cross-context handoff boundary',
              '## Compact Engineering Status Receipt',
              'Governance route:',
              'Skills used:',
              'GOVERNANCE_ROUTE_REPORTED: YES',
              'SKILLS_USED_ACTUAL_ONLY: YES',
          ):
              assert marker in governance, marker

          handoff = Path('skills/agent-handoff/SKILL.md').read_text()
          assert 'Mandatory pre-return compliance gate' in handoff
          for marker in (
              'HANDOFF_ROUTE_APPLIED: YES',
              'REQUIRED_CORE_COMPLETE: YES',
              'RETURN_CONTRACT_OUTCOME_NEUTRAL: YES',
          ):
              assert marker in handoff, marker

          # Preserve exact accepted Anthropic source body.
          anthropic = Path('skills/design/references/anthropic/frontend-design.md')
          source_blob = subprocess.check_output(['git', 'hash-object', str(anthropic)], text=True).strip()
          assert source_blob == 'a5333457c414d20d625f307df945842c0952ecc3', source_blob
          assert 'Apache License' in Path('skills/design/references/anthropic/LICENSE.txt').read_text()

          design = Path('skills/design/SKILL.md').read_text()
          for marker in (
              '## Route discriminator',
              'INTERACTION_WORKFLOW',
              'BUSINESS_STATE_WORKFLOW',
              '## Design modes',
              '### `AUDIT_ONLY`',
              '### `DESIGN_SPEC`',
              '### `DESIGN_IMPLEMENT`',
              '### `FINAL_REVIEW`',
              '## Evidence-triggered capability composition',
              'UNRESOLVED_DEPENDENCY:',
              'DESIGN_IMPACT:',
              'EXPECTED_RETURN:',
              'RESUME_STAGE:',
              '### Return-to-Design contract',
              'domain-navigation',
              'general enrichment',
              '### 7. Capture rendered evidence when supported',
              '### 8. Microsoft final Design review',
              '### 9. Final visual acceptance',
              'RENDERED_EVIDENCE: AVAILABLE | UNAVAILABLE | NOT_APPLICABLE',
              'MICROSOFT_BLOCKING_FINDINGS_OPEN: NO',
              'MICROSOFT_MAJOR_FINDINGS_OPEN: NO',
          ):
              assert marker in design, marker

          module_map = Path('skills/design/references/module-map.md').read_text()
          for marker in (
              '## Design modes',
              '## Evidence-triggered cross-Skill composition',
              '## Design vs Solution Design',
              'rendered evidence capture → Microsoft final review',
              'resume at `RESUME_STAGE`',
          ):
              assert marker in module_map, marker

          microsoft = Path('skills/design/references/microsoft/final-review.md').read_text()
          for marker in (
              'capture that evidence **before** this review',
              're-render the affected surface',
              'Final visual acceptance happens **after** the last Microsoft review/corrective cycle',
              'Blocking — must fix before Design completion',
              'Major — fix in the current Design pass',
          ):
              assert marker in microsoft, marker

          # Existing adapted modules/provenance/licenses remain packaged.
          required_module_files = (
              'skills/design/references/shadcn-admin/admin-patterns.md',
              'skills/design/references/shadcn-admin/PROVENANCE.md',
              'skills/design/references/shadcn-admin/LICENSE.txt',
              'skills/design/references/awesome-design-md/design-spec-synthesis.md',
              'skills/design/references/awesome-design-md/PROVENANCE.md',
              'skills/design/references/awesome-design-md/LICENSE.txt',
              'skills/design/references/microsoft/final-review.md',
              'skills/design/references/microsoft/PROVENANCE.md',
              'skills/design/references/microsoft/LICENSE.txt',
          )
          for rel in required_module_files:
              assert Path(rel).is_file(), rel

          global_routing = Path('skills/project-governance/references/global-routing.md').read_text()
          for marker in (
              '### Frontend workflow discriminator',
              '## Selective, evidence-triggered composition',
              'UNRESOLVED_DEPENDENCY:',
              'RESUME_OWNER_OR_STAGE:',
              'it may call `domain-navigation`',
              'call `solution-design` for that bounded decision',
          ):
              assert marker in global_routing, marker

          composition = Path('skills/project-governance/references/capability-composition.md').read_text()
          for marker in (
              '## Evidence-triggered nested composition',
              '## Design composition example',
              '## Design vs Solution Design',
              'resume at the declared stage',
          ):
              assert marker in composition, marker

          global_template = Path('skills/project-governance/assets/templates/GLOBAL_AGENTS_ROUTING.md').read_text()
          assert 'Routing is selective, not cumulative, but selected Skills are not isolated silos.' in global_template
          assert 'interaction workflow' in global_template
          assert 'business/state workflow' in global_template

          adoption = Path('skills/project-governance/references/adoption.md').read_text()
          assert 'selected Skills may make bounded evidence-triggered calls' in adoption
          assert 'bounded nested calls return to the originating capability' in adoption

          # Historical acceptance remains available.
          for rel in (
              'references/V068_DESIGN_ANTHROPIC_ACCEPTANCE.md',
              'references/V069_DESIGN_CLOSED_LOOP_RECEIPT_ACCEPTANCE.md',
              'references/V070_DESIGN_MULTI_MODULE_ACCEPTANCE.md',
          ):
              assert Path(rel).is_file(), rel

          v071 = Path('references/V071_DESIGN_ROUTING_HARDENING_ACCEPTANCE.md').read_text()
          for marker in (
              'TOP_LEVEL_SKILL_COUNT: 9',
              'DESIGN_EXTERNAL_ROUTE_ONLY: YES',
              'INTERACTION_WORKFLOW_OWNER: DESIGN',
              'BUSINESS_STATE_WORKFLOW_OWNER_WHEN_AMBIGUOUS: SOLUTION_DESIGN',
              'DESIGN_MODE_AUDIT_ONLY: YES',
              'DESIGN_MODE_DESIGN_SPEC: YES',
              'DESIGN_MODE_DESIGN_IMPLEMENT: YES',
              'DESIGN_MODE_FINAL_REVIEW: YES',
              'CROSS_SKILL_COMPOSITION_ALLOWED_WHEN_TRIGGERED: YES',
              'DOMAIN_NAVIGATION_ALLOWED_FOR_GENUINELY_UNCLEAR_ROUTE: YES',
              'GENERAL_ENRICHMENT_TRIGGERS_SKILL: NO',
              'RETURN_TO_ORIGINATING_CAPABILITY: YES',
              'BOUNDED_CALL_RESTARTS_FULL_ROUTING_TREE: NO',
              'RENDERED_EVIDENCE_BEFORE_MICROSOFT_WHEN_SUPPORTED: YES',
              'BLOCKING_MAJOR_FIX_REQUIRES_RERENDER_REREVIEW_WHEN_SUPPORTED: YES',
              'PLUGIN_PAYLOAD_PLUGIN_JSON_PLUS_SKILLS_ONLY: YES',
              'V070_ACCEPTANCE_PRESERVED: YES',
          ):
              assert marker in v071, marker
          PY

      - name: Build exact Plugin payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          files = [Path('plugin.json')] + sorted(p for p in Path('skills').rglob('*') if p.is_file())
          with zipfile.ZipFile('engineering-governance-plugin.zip', 'w', compression=zipfile.ZIP_DEFLATED) as zf:
              for path in files:
                  zf.write(path, path.as_posix())

          with zipfile.ZipFile('engineering-governance-plugin.zip') as zf:
              names = zf.namelist()
              assert len(names) == len(files), (len(names), len(files))
              assert names[0] == 'plugin.json'
              assert all(n == 'plugin.json' or n.startswith('skills/') for n in names)
              assert 'skills/design/SKILL.md' in names
              assert 'skills/design/references/microsoft/final-review.md' in names
              assert 'skills/project-governance/references/global-routing.md' in names
              assert not any(n.startswith('.codex-plugin/') for n in names)
              assert not any(n.startswith('references/') for n in names)
              assert not any(n.startswith('.github/') for n in names)

          Path('release.entries').write_text(str(len(files)))
          PY

          sha256sum engineering-governance-plugin.zip | tee release.sha256
          wc -c < engineering-governance-plugin.zip | tr -d ' ' | tee release.size

      - name: Create immutable tag and GitHub release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='plugin-v0.7.1'

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            REMOTE_TAG_SHA="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
            if [ "${REMOTE_TAG_SHA}" != "${GITHUB_SHA}" ]; then
              echo "Tag ${TAG} already exists at ${REMOTE_TAG_SHA}; refusing to move release identity from ${GITHUB_SHA}."
              exit 1
            fi
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag "${TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${TAG}"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refusing duplicate publication."
            exit 1
          fi

          SIZE="$(cat release.size)"
          SHA256="$(cut -d' ' -f1 release.sha256)"
          ENTRIES="$(cat release.entries)"

          cat > release-notes.txt <<EOF
          Engineering Governance Plugin v0.7.1

          Package version: 0.7.1

          Source SHA:
          ${GITHUB_SHA}

          Asset:
          engineering-governance-plugin.zip

          Size (bytes):
          ${SIZE}

          SHA-256:
          ${SHA256}

          Package file entries:
          ${ENTRIES}

          Included Skills: exactly 9.

          v0.7.1 Design routing hardening:
          - evidence-triggered cross-Skill composition instead of hard isolation
          - explicit interaction-workflow vs business/state-workflow routing discriminator
          - Design modes: AUDIT_ONLY / DESIGN_SPEC / DESIGN_IMPLEMENT / FINAL_REVIEW
          - bounded call return/resume contract
          - Domain Navigation remains available for genuinely unclear backend/product routes
          - rendered evidence captured before Microsoft final review when supported
          - Blocking/Major corrections re-rendered/re-reviewed before final visual acceptance
          - prior Design modules, provenance/licenses, Project Profile boundaries, receipts and nine-Skill architecture preserved

          The release asset contains only plugin.json and skills/**.
          EOF

          gh release create "${TAG}" \
            engineering-governance-plugin.zip \
            --title 'Engineering Governance Plugin v0.7.1' \
            --notes-file release-notes.txt
