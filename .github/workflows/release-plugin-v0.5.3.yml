name: Release Plugin v0.5.3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-plugin-v0.5.3.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen publication head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('plugin.json').read_text())
          assert manifest['name'] == 'engineering-governance'
          assert manifest['version'] == '0.5.3'

          expected = {'project-governance', 'domain-navigation', 'incident-doctor'}
          actual = {p.name for p in Path('skills').iterdir() if p.is_dir()}
          assert actual == expected, (actual, expected)

          required = {
              'skills/project-governance/SKILL.md': 'At a merge/release exact-head boundary',
              'skills/project-governance/references/verification-tiers.md': 'Final PR-head freeze',
              'skills/project-governance/references/control-plane.md': 'external evidence, not control-owned facts',
          }
          for path, needle in required.items():
              text = Path(path).read_text()
              assert needle in text, (path, needle)
          PY

      - name: Build exact Plugin payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile

          files = [Path('plugin.json')] + sorted(p for p in Path('skills').rglob('*') if p.is_file())
          assert len(files) == 29, len(files)
          with zipfile.ZipFile('engineering-governance-plugin.zip', 'w', compression=zipfile.ZIP_DEFLATED) as zf:
              for path in files:
                  zf.write(path, path.as_posix())
          with zipfile.ZipFile('engineering-governance-plugin.zip') as zf:
              names = zf.namelist()
              assert len(names) == 29, len(names)
              assert names[0] == 'plugin.json'
              assert all(n == 'plugin.json' or n.startswith('skills/') for n in names)
          PY
          sha256sum engineering-governance-plugin.zip | tee release.sha256
          wc -c < engineering-governance-plugin.zip | tr -d ' ' | tee release.size

      - name: Create immutable tag and GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='plugin-v0.5.3'
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; refusing to move an existing release identity."
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag "${TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}"

          SIZE="$(cat release.size)"
          SHA256="$(cut -d' ' -f1 release.sha256)"
          cat > release-notes.txt <<EOF
          Engineering Governance Plugin v0.5.3

          Package version: 0.5.3

          Source SHA:
          ${GITHUB_SHA}

          Asset:
          engineering-governance-plugin.zip

          Size (bytes):
          ${SIZE}

          SHA-256:
          ${SHA256}

          Package file entries:
          29

          Included Skills:
          - project-governance
          - domain-navigation
          - incident-doctor

          Changes since v0.5.0:
          - Final PR-head freeze for exact-head CI, review, independent audit, mergeability, and repository-host evidence
          - external verification evidence is no longer required to be committed back into the frozen HEAD
          - any real tracked source/control correction unfreezes the candidate and starts a new exact-head verification cycle
          - post-merge verification cannot create an evidence-only commit loop

          Global routing remains selection-only and exactly three top-level Skills remain. No fourth Skill, runtime, daemon, service, database, installer, or automatic remediation was added.
          EOF

          gh release create "${TAG}" engineering-governance-plugin.zip \
            --verify-tag \
            --title 'Engineering Governance Plugin v0.5.3' \
            --notes-file release-notes.txt
