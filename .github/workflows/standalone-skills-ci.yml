name: Standalone Skill Checks

# Independent source-package checks; not part of Governance plugin CI.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'standalone-skills/**'
      - '.github/workflows/standalone-skills-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-skills-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Independent Skill packages (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout PR source without stored credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install source-isolation test requirements
        run: python -m pip install -r standalone-skills/tests/requirements.txt

      - name: Compile shared source-isolation tests
        run: python -m compileall -q standalone-skills/tests

      - name: Discover and run ALL standalone Skill packages
        run: python standalone-skills/tests/run_package_tests.py

      - name: Source-repository isolation tests
        run: python -m unittest discover -s standalone-skills/tests -p 'test_*.py' -v
