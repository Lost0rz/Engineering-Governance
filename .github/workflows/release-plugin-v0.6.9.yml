name: Release Plugin v0.6.9

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-plugin-v0.6.9.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          manifest = json.loads(Path('plugin.json').read_text())
          assert manifest['name'] == 'engineering-governance'
          assert manifest['version'] == '0.6.9'

          expected = {
              'project-governance',
              'project-profile',
              'solution-design',
              'design',
              'execution-orchestrator',
              'agent-handoff',
              'evidence-audit',
              'domain-navigation',
              'incident-doctor',
          }
          actual = {p.name for p in Path('skills').iterdir() if p.is_dir()}
          assert actual == expected, (actual, expected)

          for skill in sorted(expected):
              path = Path('skills') / skill / 'SKILL.md'
              assert path.is_file(), path

          profile = Path('skills/project-profile/SKILL.md').read_text()
          assert 'Mandatory pre-return compliance gate' in profile
          assert 'AUTHORITY_MAP_POINTER_ONLY_WHEN_DOMAIN_AUTHORITY_EXISTS' in profile

          project_governance = Path('skills/project-governance/SKILL.md').read_text()
          assert 'Mandatory cross-context handoff boundary' in project_governance
          assert 'route the transfer artifact through `agent-handoff` before returning it' in project_governance

          handoff_skill = Path('skills/agent-handoff/SKILL.md').read_text()
          assert 'Mandatory pre-return compliance gate' in handoff_skill
          for marker in (
              'HANDOFF_ROUTE_APPLIED: YES',
              'REQUIRED_CORE_COMPLETE: YES',
              'MODE_VALID: YES',
              'AUTHORITY_REFERENCED_NOT_DUPLICATED: YES',
              'OBSERVED_IDENTITY_NOT_PROMOTED_TO_LOCK: YES',
              'RETURN_CONTRACT_OUTCOME_NEUTRAL: YES',
          ):
              assert marker in handoff_skill, marker

          handoff_request = Path('skills/agent-handoff/assets/templates/HANDOFF_REQUEST.md').read_text()
          for field in ('CARD_ID', 'TASK_ID', 'MODE', 'CAPABILITY', 'TARGET', 'AUTHORITY', 'DELTA', 'BOUNDARY', 'RETURN_CONTRACT'):
              assert field in handoff_request, field
          assert 'MODE: EXECUTE | AUDIT | REVIEW | VERIFY | DIAGNOSE' in handoff_request
          assert 'Do not return a known-noncompliant draft plus commentary' in handoff_request

          handoff_receipt = Path('skills/agent-handoff/assets/templates/HANDOFF_RECEIPT.md').read_text()
          for field in ('CARD_ID', 'TASK_ID', 'MODE', 'CAPABILITY', 'TARGET', 'OUTCOME'):
              assert field in handoff_receipt, field
          assert 'OUTCOME_IS_OBSERVED: YES' in handoff_receipt

          v067_acceptance = Path('references/V067_HANDOFF_CARD_ACCEPTANCE.md').read_text()
          for marker in (
              'MODE: CORRECTIVE',
              'FULL_TASK_OBJECTIVE_RECOPIED: NO',
              'CARD_INVENTS_EXPECTED_HEAD_LOCK: NO',
              'SUCCESS_PREDECLARED: NO',
              'RETURN_CONTRACT_OUTCOME_NEUTRAL: YES',
          ):
              assert marker in v067_acceptance, marker

          design = Path('skills/design/SKILL.md').read_text()
          for marker in (
              'stable routed design capability',
              'references/anthropic/frontend-design.md',
              'solution-design',
              'Planned modules are not active behavior',
          ):
              assert marker in design, marker

          anthropic_source = Path('skills/design/references/anthropic/frontend-design.md')
          assert anthropic_source.is_file()
          source_blob = subprocess.check_output(['git', 'hash-object', str(anthropic_source)], text=True).strip()
          assert source_blob == 'a5333457c414d20d625f307df945842c0952ecc3', source_blob

          license_text = Path('skills/design/references/anthropic/LICENSE.txt').read_text()
          assert 'Apache License' in license_text
          assert 'Version 2.0, January 2004' in license_text

          provenance = Path('skills/design/references/anthropic/PROVENANCE.md').read_text()
          for marker in (
              'anthropics/skills',
              'a5333457c414d20d625f307df945842c0952ecc3',
              'f433b1a53f5b830a205fd2df78e2b34974656c7b',
          ):
              assert marker in provenance, marker

          v068_acceptance = Path('references/V068_DESIGN_ANTHROPIC_ACCEPTANCE.md').read_text()
          for marker in (
              'TOP_LEVEL_SKILL_COUNT: `9`',
              'LOCAL_FRONTEND_DESIGN_CONTENT_SHA_MATCH: `YES`',
              'SEPARATE_ANTHROPIC_PLUGIN_REQUIRED: `NO`',
              'SOLUTION_DESIGN_ARCHITECTURE_AUTHORITY_PRESERVED: `YES`',
              'PRIOR_RELEASE_GATES_PRESERVED: `YES`',
          ):
              assert marker in v068_acceptance, marker

          for marker in (
              '## Mandatory Design pass',
              '## Anti-shotgun composition rule',
              'Design intent',
              'Page composition',
              'Protected authority',
              '## Design completion gate',
              'DESIGN_DELIVERABLE_COMPLETED: YES',
              'SHOTGUN_ROUTING_AVOIDED: YES',
              'A functional browser regression alone is not visual acceptance',
          ):
              assert marker in design, marker

          module_map = Path('skills/design/references/module-map.md').read_text()
          assert 'Anthropic `frontend-design` — active baseline' in module_map
          assert 'Merely reading the Anthropic source is not sufficient evidence' in module_map
          assert 'Microsoft frontend design review/adaptation — planned, not active' in module_map
          assert 'UX heuristic audit source — planned, not active' in module_map

          global_routing = Path('skills/project-governance/references/global-routing.md').read_text()
          assert 'Routing is **selective rather than cumulative**' in global_routing
          assert 'already-understood frontend redesign may route `project-governance → design`' in global_routing

          composition = Path('skills/project-governance/references/capability-composition.md').read_text()
          assert '## Composition is selective, not a pipeline' in composition
          assert 'Do **not** walk the Skill catalog from top to bottom' in composition
          assert 'Branches are gates, not stages. More branches are not better.' in composition

          global_template = Path('skills/project-governance/assets/templates/GLOBAL_AGENTS_ROUTING.md').read_text()
          assert 'Routing is selective, not cumulative' in global_template
          assert 'report the actual `Governance route` and actual `Skills used`' in global_template

          for marker in (
              '## Compact Engineering Status Receipt',
              'Governance route:',
              'Skills used:',
              'Capability modules:',
              '### Mandatory pre-return receipt compliance gate',
              'GOVERNANCE_ROUTE_REPORTED: YES',
              'SKILLS_USED_REPORTED: YES',
              'SKILLS_USED_ACTUAL_ONLY: YES',
              'ROUTE_AND_SKILLS_CONSISTENT: YES',
              'LEGACY_RECEIPT_REPLACED: YES',
          ):
              assert marker in project_governance, marker

          v069_acceptance = Path('references/V069_DESIGN_CLOSED_LOOP_RECEIPT_ACCEPTANCE.md').read_text()
          for marker in (
              'DESIGN_ROUTE_APPLIED: YES',
              'ANTHROPIC_ACTIVE_MODULE_USED: YES',
              'DESIGN_DELIVERABLE_REQUIRED_BEFORE_IMPLEMENTATION: YES',
              'PRE_BUILD_SELF_REVIEW_REQUIRED: YES',
              'RENDERED_VISUAL_CRITIQUE_REQUIRED_WHEN_SUPPORTED: YES',
              'ROUTING_SELECTIVE_NOT_CUMULATIVE: YES',
              'SIMPLE_FRONTEND_BUG_FORCES_DESIGN: NO',
              'MULTI_SKILL_REQUIRES_DISTINCT_MATERIAL_TRIGGERS: YES',
              'GOVERNANCE_ROUTE_REQUIRED_IN_RECEIPT: YES',
              'SKILLS_USED_REQUIRED_IN_RECEIPT: YES',
              'SKILLS_USED_ACTUAL_ONLY: YES',
              'LEGACY_RECEIPT_WITHOUT_ROUTE_OR_SKILLS_ALLOWED: NO',
              'ANTHROPIC_SOURCE_IDENTITY_PRESERVED: YES',
              'MICROSOFT_MODULE_ACTIVE: NO',
              'UX_AUDIT_MODULE_ACTIVE: NO',
              'PRIOR_RELEASE_GATES_PRESERVED: YES',
          ):
              assert marker in v069_acceptance, marker
          PY

      - name: Build exact Plugin payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          files = [Path('plugin.json')] + sorted(
              p for p in Path('skills').rglob('*') if p.is_file()
          )

          with zipfile.ZipFile('engineering-governance-plugin.zip', 'w', compression=zipfile.ZIP_DEFLATED) as zf:
              for path in files:
                  zf.write(path, path.as_posix())

          with zipfile.ZipFile('engineering-governance-plugin.zip') as zf:
              names = zf.namelist()
              assert len(names) == len(files), (len(names), len(files))
              assert names[0] == 'plugin.json'
              assert all(n == 'plugin.json' or n.startswith('skills/') for n in names)
              assert 'skills/design/SKILL.md' in names
              assert 'skills/design/references/anthropic/frontend-design.md' in names
              assert 'skills/design/references/anthropic/LICENSE.txt' in names
              assert 'skills/design/references/anthropic/PROVENANCE.md' in names
              assert not any(n.startswith('.codex-plugin/') for n in names)

          Path('release.entries').write_text(str(len(files)))
          PY

          sha256sum engineering-governance-plugin.zip | tee release.sha256
          wc -c < engineering-governance-plugin.zip | tr -d ' ' | tee release.size

      - name: Create immutable tag and GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='plugin-v0.6.9'

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            REMOTE_TAG_SHA="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
            if [ "${REMOTE_TAG_SHA}" != "${GITHUB_SHA}" ]; then
              echo "Tag ${TAG} already exists at ${REMOTE_TAG_SHA}; refusing to move release identity from ${GITHUB_SHA}."
              exit 1
            fi
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag "${TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${TAG}"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refusing duplicate publication."
            exit 1
          fi

          SIZE="$(cat release.size)"
          SHA256="$(cut -d' ' -f1 release.sha256)"
          ENTRIES="$(cat release.entries)"

          cat > release-notes.txt <<EOF
          Engineering Governance Plugin v0.6.9

          Package version: 0.6.9

          Source SHA:
          ${GITHUB_SHA}

          Asset:
          engineering-governance-plugin.zip

          Size (bytes):
          ${SIZE}

          SHA-256:
          ${SHA256}

          Package file entries:
          ${ENTRIES}

          Included Skills:
          - project-governance
          - project-profile
          - solution-design
          - design
          - execution-orchestrator
          - agent-handoff
          - evidence-audit
          - domain-navigation
          - incident-doctor

          v0.6.9 corrective changes:
          - make the Anthropic Design baseline execute a bounded understand/diagnose/design/review/build/visual-critique loop
          - require an explicit Design deliverable before implementation for qualifying redesign work
          - require rendered visual critique/corrective pass when the execution environment supports it
          - distinguish functional browser regression from visual acceptance
          - make Skill composition selective rather than a linear all-Skill pipeline
          - strengthen Project Governance pre-return receipt enforcement for actual Governance route and actual Skills used
          - preserve Anthropic source identity/provenance, nine-Skill capability model, Project Profile and Agent Handoff gates
          - keep Microsoft design-review/adaptation and UX heuristic/audit modules planned but inactive

          The release asset contains only plugin.json and skills/**. Repository controls, documents, references, marketplace catalogs and workflows are not packaged into the Plugin ZIP.
          EOF

          gh release create "${TAG}" engineering-governance-plugin.zip \
            --verify-tag \
            --title 'Engineering Governance Plugin v0.6.9' \
            --notes-file release-notes.txt
