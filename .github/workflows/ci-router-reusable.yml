name: Engineering Governance reusable CI router

on:
  workflow_call:
    inputs:
      stage:
        type: string
        required: false
        default: auto
      capabilities_path:
        type: string
        required: false
        default: .github/ci-capabilities.json
      focused_test:
        type: string
        required: false
        default: ""
      comparison_base:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  route:
    name: Select tests from accepted project capabilities
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      run_tests: ${{ steps.select.outputs.run_tests }}
      review_required: ${{ steps.select.outputs.review_required }}
      coverage: ${{ steps.select.outputs.coverage }}
      selected: ${{ steps.select.outputs.selected }}
      stage: ${{ steps.select.outputs.stage }}
      capabilities_changed: ${{ steps.select.outputs.capabilities_changed }}
    steps:
      - name: Checkout tested event revision (PR merged tree or manual commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: project

      # Caller must pin the matching published workflow and router release.
      # No commands are loaded from the PR version of capabilities.json.
      - name: Checkout pinned Governance router
        uses: actions/checkout@v4
        with:
          repository: Lost0rz/Engineering-Governance
          ref: v0.10.1
          persist-credentials: false
          path: governance

      - name: Plan affected tests
        id: select
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STAGE_REQUEST: ${{ inputs.stage }}
          FOCUSED_TEST: ${{ inputs.focused_test }}
          CAPABILITIES_PATH: ${{ inputs.capabilities_path }}
          PR_IS_DRAFT: ${{ github.event.pull_request.draft }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          COMPARISON_BASE: ${{ inputs.comparison_base }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          if [[ "$STAGE_REQUEST" == "auto" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$PR_IS_DRAFT" == "true" ]]; then
              stage=draft
            else
              stage=ready
            fi
          else
            stage="$STAGE_REQUEST"
          fi
          # A PR's merge check cannot be downgraded to focused/none by input.
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$STAGE_REQUEST" != "auto" ]]; then
            echo "::error::PR verification must select the Ready scope via auto."
            exit 2
          fi
          source_trust=internal
          if [[ "$IS_FORK" == "true" ]]; then
            source_trust=fork
          fi
          # Trust commands from the accepted base, not the PR's new config.
          CONFIG_REF="$BASE_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            test -n "$DEFAULT_BRANCH"
            # fetch-depth=0 retrieves origin/*; no private repo credentials needed.
            TRUSTED_DEFAULT="refs/remotes/origin/$DEFAULT_BRANCH"
            git -C project show-ref --verify --quiet "$TRUSTED_DEFAULT" || {
              echo "::error::Default branch remote ref unavailable after checkout."
              exit 2
            }
            CONFIG_REF="$(git -C project rev-parse --verify "$TRUSTED_DEFAULT^{commit}")"
            if [[ -z "$COMPARISON_BASE" ]]; then
              if [[ "$stage" == "ready" || "$stage" == "milestone" ]]; then
                echo "::error::Manual affected verification requires an explicit accepted comparison_base SHA."
                exit 2
              fi
              BASE_SHA="$CONFIG_REF"
            else
              BASE_SHA="$COMPARISON_BASE"
              if ! git -C project cat-file -e "$BASE_SHA^{commit}" 2>/dev/null ||
                 ! git -C project merge-base --is-ancestor "$BASE_SHA" "$CONFIG_REF" ||
                 ! git -C project merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; then
                echo "::error::comparison_base must be an ancestor of default branch and tested HEAD."
                exit 2
              fi
            fi
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] && \
             [[ "$stage" == "ready" || "$stage" == "milestone" ]] && \
             [[ "$BASE_SHA" == "$HEAD_SHA" ]]; then
            echo "::error::Affected verification requires comparison_base different from tested HEAD."
            exit 2
          fi
          test -n "$BASE_SHA" && test -n "$CONFIG_REF"
          python3 governance/skills/project-governance/scripts/ci-router.py plan \
            --repo-root project --base "$BASE_SHA" --head "$HEAD_SHA" \
            --config-ref "$CONFIG_REF" --config-path "$CAPABILITIES_PATH" --config-source base \
            --source-trust "$source_trust" --stage "$stage" --focused "$FOCUSED_TEST" \
            --output "$RUNNER_TEMP/eg-ci-plan.json" \
            --github-output "$GITHUB_OUTPUT"
          python3 - "$RUNNER_TEMP/eg-ci-plan.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          p = json.load(open(sys.argv[1]))
          print("### Engineering Governance selected tests")
          for key in ("base", "head", "stage", "coverage", "config_ref", "config_sha256"):
              print("- " + key + ": " + str(p[key]))
          print("- Selected: " + (", ".join(p["selected_test_ids"]) or "NONE"))
          if p["capabilities_changed"]:
              print("- Capabilities: PR format checked; accepted-base commands used.")
              print("- New commands must be evaluated after they enter the trusted baseline.")
          if p.get("proposed_catalog_status"):
              print("- Proposed config: " + p["proposed_catalog_status"])
          print("- Unmapped: " + (", ".join(p["unmapped_paths"]) or "NONE"))
          print("- Source trust: " + p["source_trust"])
          print("- Fork-unsafe tests withheld: " + (", ".join(p["fork_blocked_tests"]) or "NONE"))
          print("- Tests are NOT_RUN until the execution job reports its result.")
          PY

  execute:
    name: Run selected project test
    needs: route
    if: needs.route.outputs.run_tests == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.route.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    steps:
      - name: Checkout tested event revision (PR merged tree or manual commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          # PR merge commit parent 1 is the accepted base. Depth 2 lets a
          # project-owned test executor read its trusted catalog without a
          # network fetch (including in private repositories).
          fetch-depth: 2
          persist-credentials: false

      - name: Execute accepted-base test command
        shell: bash
        run: ${{ matrix.script }}

  result:
    # Manual focused checks must not impersonate the PR's required status.
    name: ${{ github.event_name == 'pull_request' && 'EG Ready verification' || 'EG Manual scoped verification' }}
    needs: [route, execute]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report actual result
        shell: bash
        env:
          ROUTE_RESULT: ${{ needs.route.result }}
          EXECUTE_RESULT: ${{ needs.execute.result }}
          SELECTED: ${{ needs.route.outputs.selected }}
          RUN_TESTS: ${{ needs.route.outputs.run_tests }}
          REVIEW_REQUIRED: ${{ needs.route.outputs.review_required }}
          COVERAGE: ${{ needs.route.outputs.coverage }}
          STAGE: ${{ needs.route.outputs.stage }}
          EVENT_NAME: ${{ github.event_name }}
          CAPABILITIES_CHANGED: ${{ needs.route.outputs.capabilities_changed }}
        run: |
          set -euo pipefail
          {
            echo "### Engineering Governance CI"
            echo "- Selected: ${SELECTED:-NONE}"
            echo "- Coverage: ${COVERAGE:-UNKNOWN}"
            echo "- Stage: ${STAGE:-UNKNOWN}"
            echo "- Capabilities changed: ${CAPABILITIES_CHANGED:-UNKNOWN}"
            echo "- Route: $ROUTE_RESULT"
            echo "- Executor: $EXECUTE_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$ROUTE_RESULT" == "success" ]] || exit 1
          if [[ "$EVENT_NAME" == "pull_request" && "$STAGE" != "ready" ]]; then
            echo "::error::PR readiness cannot be satisfied by a deferred or focused run."
            exit 1
          fi
          if [[ "$RUN_TESTS" == "true" ]]; then
            [[ "$EXECUTE_RESULT" == "success" ]] || exit 1
          fi
          if [[ "$REVIEW_REQUIRED" == "true" ]]; then
            echo "::error::Unmapped source paths require a test capability decision."
            exit 1
          fi
          if [[ "$RUN_TESTS" == "true" ]]; then
            echo "EG_CI_SELECTED_VERIFICATION_COMPLETE (not FULL_SUITE_PASS)"
          else
            echo "EG_CI_NO_TESTS_EXECUTED: stage=$STAGE coverage=$COVERAGE"
          fi
