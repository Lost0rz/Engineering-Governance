name: Governance Contract Checks

# Draft PR iterations do not execute CI. Ready PRs validate accepted-base
# affected scope; manual dispatch chooses a focused or full stage explicitly.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      validation_scope:
        description: "Manual checks: one suite, affected workflow contracts, full, or none"
        type: choice
        required: true
        default: focused
        options:
          - focused
          - affected
          - full
          - none
      focused_suite:
        description: "Focused suite when requested"
        type: choice
        required: false
        default: test_workflow_contracts.py
        options:
          - test_workflow_contracts.py
          - test_verification_plan.py
          - test_ci_router.py
      package_preview:
        description: "Build optional preview independently of test scope"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: governance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Python governance contracts
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR or selected manual ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Choose manual scope or trusted PR-base selection
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MANUAL_SCOPE: ${{ inputs.validation_scope }}
        run: |
          set -euo pipefail
          SELECTOR="skills/project-governance/scripts/verification-plan.py"
          PLAN_PATH="$RUNNER_TEMP/verification-plan.json"
          fallback_full() {
            echo "::warning::Cannot verify base selector/diff; running full contracts, not claiming a selection PASS."
            {
              echo "tier=V3"
              echo "run_policy=false"
              echo "run_affected=false"
              echo "run_full=true"
              echo "scope_status=SCOPE_GATE_FALLBACK_FULL"
            } >> "$GITHUB_OUTPUT"
            echo '{"contract":"VERIFICATION_PLAN_V1","tier":"V3","scope_status":"SCOPE_GATE_FALLBACK_FULL","test_status":"TESTS_PENDING","full_suite_claim":false}' > "$PLAN_PATH"
          }
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$MANUAL_SCOPE" in
              focused|affected|full|none) ;;
              *) echo "::error::Invalid explicit manual test scope"; exit 2;;
            esac
            echo "tier=MANUAL" >> "$GITHUB_OUTPUT"
            echo "run_policy=false" >> "$GITHUB_OUTPUT"
            echo "run_affected=false" >> "$GITHUB_OUTPUT"
            echo "run_full=false" >> "$GITHUB_OUTPUT"
            echo "scope_status=MANUAL_SCOPE_SELECTED" >> "$GITHUB_OUTPUT"
            printf '{"contract":"MANUAL_SCOPE_V1","scope":"%s","test_status":"TESTS_PENDING"}\n' "$MANUAL_SCOPE" > "$PLAN_PATH"
          elif [[ -z "${BASE_SHA:-}" || -z "${HEAD_SHA:-}" ]] || ! git cat-file -e "$BASE_SHA:$SELECTOR" 2>/dev/null; then
            fallback_full
          else
            git show "$BASE_SHA:$SELECTOR" > "$RUNNER_TEMP/trusted-verification-plan.py"
            if ! python3 "$RUNNER_TEMP/trusted-verification-plan.py" \
              --repo-root "$GITHUB_WORKSPACE" \
              --base "$BASE_SHA" --head "$HEAD_SHA" \
              --output "$PLAN_PATH" --github-output "$GITHUB_OUTPUT"; then
              fallback_full
            fi
          fi
          cat "$PLAN_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Static source, manifest and host policy checks
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path(".")
          workflows = sorted(p.name for p in (root / ".github/workflows").glob("*.yml"))
          assert workflows == ["ci-router-reusable.yml", "governance-contract-checks.yml"], workflows
          pkg = json.loads((root / "plugin.json").read_text())
          assert pkg["name"] == "engineering-governance"
          json.loads((root / ".agents/plugins/marketplace.json").read_text())
          policy = json.loads((root / "skills/project-governance/assets/control-policy.json").read_text())
          assert policy["contract"] == "CONTROL_POLICY_V2"
          assert policy["require_host_authority_for_writes"] is True
          assert policy["unattended_grants"] == "NOT_PROVIDED_BY_PLUGIN"
          assert policy["issue_role"] == "OPTIONAL_PLANNING_AND_CROSS_CONTEXT_EVIDENCE"
          assert (root / ".github/ISSUE_TEMPLATE/task-plan.md").is_file()
          assert not (root / ".github/ISSUE_TEMPLATE/execution-spec.yml").exists()
          PY

      - name: Compile current test modules
        if: steps.scope.outputs.run_full == 'true' || inputs.validation_scope == 'full'
        run: python3 -m compileall -q skills/project-governance/scripts

      - name: PR V1 policy and routing contracts
        if: steps.scope.outputs.run_policy == 'true'
        run: python3 -m unittest discover -s skills/project-governance/scripts -p 'test_workflow_contracts.py' -v

      - name: PR V2 affected contracts
        if: steps.scope.outputs.run_affected == 'true'
        shell: bash
        env:
          PLAN_PATH: ${{ runner.temp }}/verification-plan.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from subprocess import run
          p = json.loads(Path(os.environ["PLAN_PATH"]).read_text())
          allowed = {"test_workflow_contracts.py", "test_verification_plan.py"}
          suites = p["affected_suites"]
          assert p["policy_source"] == "TRUSTED_BASE" and p["tier"] == "V2"
          assert p["selected"] == ["static_scope", "affected_contracts"]
          assert isinstance(suites, list) and suites and len(set(suites)) == len(suites)
          assert set(suites).issubset(allowed)
          for suite in suites:
              run(["python3", "-m", "unittest", "discover", "-s",
                   "skills/project-governance/scripts", "-p", suite, "-v"], check=True)
          print("V2_AFFECTED_CHECKS_PASS")
          PY

      - name: PR V3 full contracts
        if: steps.scope.outputs.run_full == 'true'
        run: python3 -m unittest discover -s skills/project-governance/scripts -p 'test_*.py' -v

      - name: Manual focused suite
        if: github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'focused'
        env:
          FOCUSED_SUITE: ${{ inputs.focused_suite }}
        shell: bash
        run: |
          set -euo pipefail
          case "$FOCUSED_SUITE" in
            test_workflow_contracts.py|test_verification_plan.py|test_ci_router.py) ;;
            *) echo "::error::Focused suite not in allowed list"; exit 2;;
          esac
          python3 -m unittest discover -s skills/project-governance/scripts -p "$FOCUSED_SUITE" -v

      - name: Manual affected workflow contracts
        if: github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'affected'
        run: python3 -m unittest discover -s skills/project-governance/scripts -p 'test_workflow_contracts.py' -v

      - name: Manual full regression
        if: github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'full'
        run: python3 -m unittest discover -s skills/project-governance/scripts -p 'test_*.py' -v

      - name: Report scope and intentionally skipped checks
        if: steps.scope.outputs.run_full != 'true' && inputs.validation_scope != 'full'
        run: echo "SELECTED_CHECKS_ONLY / OTHER_TESTS_SKIPPED — not FULL_SUITE_PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Build versioned Web preview package
        if: github.event_name == 'workflow_dispatch' && inputs.package_preview == true
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import zipfile

          repo = Path(".")
          original = json.loads((repo / "plugin.json").read_text(encoding="utf-8"))
          assert original["name"] == "engineering-governance"
          version = original["version"]  # single canonical version owner
          assert version and isinstance(version, str)

          codex_manifest = {
              "interface": {
                  "displayName": "Engineering Governance",
                  "shortDescription": original["extensions"]["com.openai"]["interface"]["shortDescription"],
                  "longDescription": original["description"],
                  "developerName": "Workspace upload",
                  "category": "Other",
                  "capabilities": [],
                  "defaultPrompt": None,
              },
              "name": original["name"],
              "version": version,
              "description": original["description"],
              "author": {"name": "Workspace upload"},
              "keywords": [],
              "skills": "./skills",
          }
          head = os.popen("git rev-parse HEAD").read().strip()
          assert len(head) == 40 and all(c in "0123456789abcdef" for c in head)
          out = Path("dist") / f"engineering-governance-web-preview-{version}-{head[:12]}.zip"
          out.parent.mkdir(exist_ok=True)
          entries = sorted(list(Path("skills").rglob("*")) + list(Path("references").rglob("*")))
          entries = [path for path in entries if path.is_file()
                     and "__pycache__" not in path.parts and path.suffix != ".pyc"
                     and not path.name.endswith("_ACCEPTANCE.md")]
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as archive:
              archive.writestr("plugin.json", json.dumps(original, indent=2, ensure_ascii=False) + "\n")
              archive.writestr(".codex-plugin/plugin.json", json.dumps(codex_manifest, indent=2, ensure_ascii=False) + "\n")
              for path in entries:
                  archive.write(path, path.as_posix())
              archive.writestr("PREVIEW_SOURCE_SHA.txt", head + "\n")
          print(f"WEB_PREVIEW_PACKAGE={out}")
          print(f"WEB_PREVIEW_SOURCE_SHA={head}")
          print(f"WEB_PREVIEW_FILE_COUNT={len(entries) + 3}")
          PY

      - name: Upload Web preview package (artifact only; no release)
        if: github.event_name == 'workflow_dispatch' && inputs.package_preview == true
        uses: actions/upload-artifact@v4
        with:
          name: engineering-governance-web-preview
          path: dist/engineering-governance-web-preview-*.zip
          if-no-files-found: error
          retention-days: 7
