name: Governance Contract Checks

# Draft PR iterations do not execute CI. Ready PRs validate accepted-base
# affected scope via ci-router.py; manual dispatch chooses focused/affected/full/none.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      validation_scope:
        description: "Manual checks: one suite, affected workflow/packaging contracts, full, or none"
        type: choice
        required: true
        default: focused
        options:
          - focused
          - affected
          - full
          - none
      focused_suite:
        description: "Focused suite when requested"
        type: choice
        required: false
        default: test_workflow_contracts.py
        options:
          - test_workflow_contracts.py
          - test_ci_router.py
          - test_plugin_packaging.py
      package_preview:
        description: "Build optional preview independently of test scope"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: governance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Python governance contracts
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested revision (PR merge tree or manual ref)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Choose manual scope or trusted PR-base selection
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MANUAL_SCOPE: ${{ inputs.validation_scope }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          ROUTER="skills/ci-governance/scripts/ci-router.py"
          LEGACY_ROUTER="skills/project-governance/scripts/ci-router.py"
          CATALOG=".github/ci-capabilities.json"
          PLAN_PATH="$RUNNER_TEMP/verification-plan.json"
          fallback_full() {
            echo "::warning::Cannot verify base router/catalog; running full contracts, not claiming a selection PASS."
            {
              echo "use_plan=false"
              echo "run_full=true"
              echo "has_trusted_router=false"
              echo "scope_status=SCOPE_GATE_FALLBACK_FULL"
            } >> "$GITHUB_OUTPUT"
            echo '{"contract":"EG_CI_PLAN_V1","stage":"ready","coverage":"SCOPE_GATE_FALLBACK_FULL","test_status":"TESTS_PENDING","full_suite_claim":false}' > "$PLAN_PATH"
          }
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$MANUAL_SCOPE" in
              focused|affected|full|none) ;;
              *) echo "::error::Invalid explicit manual test scope"; exit 2;;
            esac
            {
              echo "use_plan=false"
              echo "run_full=$([[ "$MANUAL_SCOPE" == "full" ]] && echo true || echo false)"
              echo "has_trusted_router=false"
              echo "scope_status=MANUAL_SCOPE_SELECTED"
            } >> "$GITHUB_OUTPUT"
            printf '{"contract":"MANUAL_SCOPE_V1","scope":"%s","test_status":"TESTS_PENDING"}\n' "$MANUAL_SCOPE" > "$PLAN_PATH"
          elif [[ -z "${BASE_SHA:-}" || -z "${HEAD_SHA:-}" ]]; then
            fallback_full
          else
            if git rev-parse --verify -q "HEAD^2" >/dev/null; then
              MERGE_P1="$(git rev-parse HEAD^1)"
              MERGE_P2="$(git rev-parse HEAD^2)"
              if [[ "$MERGE_P2" != "$HEAD_SHA" ]] || ! git merge-base --is-ancestor "$BASE_SHA" "$MERGE_P1"; then
                echo "::error::PR merge tree parents do not match pull_request base/head identity."
                exit 2
              fi
              BASE_SHA="$MERGE_P1"
            fi
            TRUSTED_PATH=""
            if git cat-file -e "$BASE_SHA:$ROUTER" 2>/dev/null; then
              TRUSTED_PATH="$ROUTER"
            elif git cat-file -e "$BASE_SHA:$LEGACY_ROUTER" 2>/dev/null; then
              TRUSTED_PATH="$LEGACY_ROUTER"
            fi
            if [[ -z "$TRUSTED_PATH" ]] || ! git cat-file -e "$BASE_SHA:$CATALOG" 2>/dev/null; then
              fallback_full
            else
              git show "$BASE_SHA:$TRUSTED_PATH" > "$RUNNER_TEMP/trusted-ci-router.py"
              source_trust=internal
              if [[ "${IS_FORK:-false}" == "true" ]]; then
                source_trust=fork
              fi
              if python3 "$RUNNER_TEMP/trusted-ci-router.py" plan \
                --repo-root "$GITHUB_WORKSPACE" \
                --base "$BASE_SHA" --head "$HEAD_SHA" \
                --config-ref "$BASE_SHA" --config-path "$CATALOG" --config-source base \
                --source-trust "$source_trust" --stage ready \
                --output "$PLAN_PATH"; then
                {
                  echo "use_plan=true"
                  echo "run_full=false"
                  echo "has_trusted_router=true"
                  echo "scope_status=TRUSTED_PLAN_READY"
                } >> "$GITHUB_OUTPUT"
              else
                fallback_full
              fi
            fi
          fi
          cat "$PLAN_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Static source, manifest, catalog and host policy checks
        if: github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'none'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path(".")
          workflows = sorted(p.name for p in (root / ".github/workflows").glob("*.yml"))
          assert workflows == ["ci-router-reusable.yml", "governance-contract-checks.yml"], workflows
          pkg = json.loads((root / "plugin.json").read_text(encoding="utf-8"))
          assert pkg["name"] == "engineering-governance"
          json.loads((root / ".agents/plugins/marketplace.json").read_text(encoding="utf-8"))
          policy = json.loads((root / "skills/engineering-workflow/assets/control-policy.json").read_text(encoding="utf-8"))
          assert policy["contract"] == "CONTROL_POLICY_V2"
          assert policy["require_host_authority_for_writes"] is True
          assert policy["unattended_grants"] == "NOT_PROVIDED_BY_PLUGIN"
          assert policy["issue_role"] == "OPTIONAL_PLANNING_AND_CROSS_CONTEXT_EVIDENCE"
          assert (root / "rules/AGENTS.md").is_file()
          assert (root / ".github/ISSUE_TEMPLATE/task-plan.md").is_file()
          assert not (root / ".github/ISSUE_TEMPLATE/execution-spec.yml").exists()
          PY
          if [[ "${{ steps.scope.outputs.has_trusted_router }}" == "true" ]]; then
            python3 "$RUNNER_TEMP/trusted-ci-router.py" check-catalog --repo-root . --require-complete-mapping
          fi
          python3 skills/ci-governance/scripts/ci-router.py check-catalog --repo-root . --require-complete-mapping

      - name: Execute planned PR checks
        if: steps.scope.outputs.use_plan == 'true'
        shell: bash
        env:
          PLAN_PATH: ${{ runner.temp }}/verification-plan.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from subprocess import run

          plan = json.loads(Path(os.environ["PLAN_PATH"]).read_text(encoding="utf-8"))
          assert plan["contract"] == "EG_CI_PLAN_V1"
          assert plan["config_source"] == "ACCEPTED_BASE"
          assert not plan["review_required"], f"Unmapped or fork-blocked paths: {plan}"
          if not plan["run_tests"]:
              print("NO_TESTS_REQUIRED")
          else:
              for item in plan["matrix"]["include"]:
                  print(f"::group::Run {item['id']} ({item['tier']})")
                  run(["bash", "-c", item["script"]], check=True)
                  print("::endgroup::")
          PY

      - name: Compile and run full contracts
        if: steps.scope.outputs.run_full == 'true'
        run: |
          python3 -m compileall -q skills/ci-governance/scripts scripts tests
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Manual focused suite
        if: github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'focused'
        env:
          FOCUSED_SUITE: ${{ inputs.focused_suite }}
        shell: bash
        run: |
          set -euo pipefail
          case "$FOCUSED_SUITE" in
            test_workflow_contracts.py|test_ci_router.py|test_plugin_packaging.py) ;;
            *) echo "::error::Focused suite not in allowed list"; exit 2;;
          esac
          python3 -m unittest discover -s tests -p "$FOCUSED_SUITE" -v

      - name: Manual affected workflow and packaging contracts
        if: github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'affected'
        run: |
          python3 -m unittest discover -s tests -p 'test_workflow_contracts.py' -v
          python3 -m unittest discover -s tests -p 'test_plugin_packaging.py' -v

      - name: Report scope and intentionally skipped checks
        if: steps.scope.outputs.run_full != 'true' && inputs.validation_scope != 'full'
        run: echo "SELECTED_CHECKS_ONLY / OTHER_TESTS_SKIPPED — not FULL_SUITE_PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Build versioned Web preview package
        if: github.event_name == 'workflow_dispatch' && inputs.package_preview == true
        run: python3 scripts/package-plugin.py --output-dir dist

      - name: Upload Web preview package (artifact only; no release)
        if: github.event_name == 'workflow_dispatch' && inputs.package_preview == true
        uses: actions/upload-artifact@v4
        with:
          name: engineering-governance-web-preview
          path: dist/engineering-governance-web-preview-*.zip
          if-no-files-found: error
          retention-days: 7

  reusable_probe_mutable:
    if: github.event_name == 'workflow_dispatch'
    uses: Lost0rz/Engineering-Governance/.github/workflows/ci-router-reusable.yml@fix/reusable-workflow-ref-v0111
    with:
      capabilities_path: .github/ci-capabilities.json
      control_runner: '["ubuntu-latest"]'
      stage: none
