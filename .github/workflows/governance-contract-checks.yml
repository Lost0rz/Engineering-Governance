name: Governance Contract Checks

# One stable required status on every PR. The verification plan chooses tests;
# the workflow must never skip the entire status context.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Python governance contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR source and full trusted history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Select verification from protected base policy
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          SELECTOR="skills/project-governance/scripts/verification-plan.py"
          PLAN_PATH="$RUNNER_TEMP/verification-plan.json"
          fallback_full() {
            echo "::warning::Trusted base verification selector not available or evidence invalid; running full contracts."
            {
              echo "tier=V3"
              echo "run_policy=false"
              echo "run_affected=false"
              echo "run_full=true"
              echo "run_package=true"
              echo "scope_status=SCOPE_GATE_FALLBACK_FULL"
            } >> "$GITHUB_OUTPUT"
            echo '{"contract":"VERIFICATION_PLAN_V1","tier":"V3","scope_status":"SCOPE_GATE_FALLBACK_FULL","selected":["static_scope","full_contracts","package_preview"],"skipped":[],"test_status":"TESTS_PENDING","full_suite_claim":false}' > "$PLAN_PATH"
          }
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" || -z "$BASE_SHA" || -z "$HEAD_SHA" ]]; then
            fallback_full
          elif ! git cat-file -e "$BASE_SHA:$SELECTOR" 2>/dev/null; then
            fallback_full
          else
            # The selector is read from the accepted base, never from the PR head.
            git show "$BASE_SHA:$SELECTOR" > "$RUNNER_TEMP/trusted-verification-plan.py"
            if python3 "$RUNNER_TEMP/trusted-verification-plan.py" \
                --repo-root "$GITHUB_WORKSPACE" \
                --base "$BASE_SHA" --head "$HEAD_SHA" \
                --output "$PLAN_PATH" --github-output "$GITHUB_OUTPUT"; then
              echo "Verification routed by trusted base."
            else
              fallback_full
            fi
          fi
          cat "$PLAN_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Static manifest and repository authority checks
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path(".")
          # A single current read-only CI workflow owns verification. Historical
          # per-version release Actions must never re-enter the active tree.
          active_workflows = sorted(
              file.name for file in (root / ".github/workflows").iterdir()
              if file.is_file() and file.suffix in (".yml", ".yaml")
          )
          assert active_workflows == ["governance-contract-checks.yml"], active_workflows
          for name in ("plugin.json", ".agents/plugins/marketplace.json"):
              data = json.loads((root / name).read_text(encoding="utf-8"))
              assert isinstance(data, dict), name
          agents = (root / "AGENTS.md").read_text(encoding="utf-8")
          template = (root / "skills/project-governance/assets/templates/AGENTS.md").read_text(encoding="utf-8")
          policy = json.loads((root / "skills/project-governance/assets/control-policy.json").read_text(encoding="utf-8"))
          assert policy["contract"] == "CONTROL_POLICY_V1"
          assert policy["default_mode"] == "ISSUE_CONTROL"
          assert policy["require_host_authority_for_writes"] is True
          assert policy["risk_scoped_autonomy"] == "DISABLED"
          assert policy["delegated_approval"] == "DISABLED"
          for content in (agents, template):
              for key in ("CONTROL_MODE:", "ISSUE_APPROVERS:", "ISSUE_WEB_SPEC_AUTHORING:",
                          "ISSUE_DELEGATED_APPROVAL:", "RISK_SCOPED_AUTONOMY:"):
                  assert not any(line.startswith(key) for line in content.splitlines()), key
          PY

      - name: Compile governance checker and tests
        if: steps.scope.outputs.run_full == 'true'
        run: python3 -m compileall -q skills/project-governance/scripts

      - name: Run scoped governance policy contracts
        if: steps.scope.outputs.run_policy == 'true'
        run: python3 -m unittest discover -s skills/project-governance/scripts -p 'test_eg097_policy_contracts.py' -v

      - name: Run affected cross-Skill integration contracts
        if: steps.scope.outputs.run_affected == 'true'
        run: |
          python3 -m unittest discover -s skills/project-governance/scripts -p 'test_eg097_policy_contracts.py' -v
          python3 -m unittest discover -s skills/project-governance/scripts -p 'test_control_policy.py' -v

      - name: Run full governance contract tests
        if: steps.scope.outputs.run_full == 'true'
        run: python3 -m unittest discover -s skills/project-governance/scripts -p 'test_*.py' -v

      - name: Report intentionally skipped test coverage
        if: steps.scope.outputs.run_full != 'true'
        shell: bash
        run: |
          echo "SCOPE_GATE_PASS / TESTS_SKIPPED — not FULL_TESTS_PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Build versioned Web preview package
        if: steps.scope.outputs.run_package == 'true'
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import zipfile

          repo = Path(".")
          original = json.loads((repo / "plugin.json").read_text(encoding="utf-8"))
          assert original["name"] == "engineering-governance"
          version = original["version"]  # single canonical version owner
          assert version and isinstance(version, str)

          codex_manifest = {
              "interface": {
                  "displayName": "Engineering Governance",
                  "shortDescription": original["extensions"]["com.openai"]["interface"]["shortDescription"],
                  "longDescription": original["description"],
                  "developerName": "Workspace upload",
                  "category": "Other",
                  "capabilities": [],
                  "defaultPrompt": None,
              },
              "name": original["name"],
              "version": version,
              "description": original["description"],
              "author": {"name": "Workspace upload"},
              "keywords": [],
              "skills": "./skills",
          }
          head = os.popen("git rev-parse HEAD").read().strip()
          assert len(head) == 40 and all(c in "0123456789abcdef" for c in head)
          out = Path("dist") / f"engineering-governance-web-preview-{version}-{head[:12]}.zip"
          out.parent.mkdir(exist_ok=True)
          entries = sorted(list(Path("skills").rglob("*")) + list(Path("references").rglob("*")))
          entries = [path for path in entries if path.is_file() and not "__pycache__" in path.parts and path.suffix != ".pyc"]
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as archive:
              archive.writestr("plugin.json", json.dumps(original, indent=2, ensure_ascii=False) + "\n")
              archive.writestr(".codex-plugin/plugin.json", json.dumps(codex_manifest, indent=2, ensure_ascii=False) + "\n")
              for path in entries:
                  archive.write(path, path.as_posix())
              archive.writestr("PREVIEW_SOURCE_SHA.txt", head + "\n")
          print(f"WEB_PREVIEW_PACKAGE={out}")
          print(f"WEB_PREVIEW_SOURCE_SHA={head}")
          print(f"WEB_PREVIEW_FILE_COUNT={len(entries) + 3}")
          PY

      - name: Upload Web preview package (artifact only; no release)
        if: steps.scope.outputs.run_package == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: engineering-governance-web-preview
          path: dist/engineering-governance-web-preview-*.zip
          if-no-files-found: error
          retention-days: 7
