name: Release Plugin v0.5.4

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-plugin-v0.5.4.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen publication head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('plugin.json').read_text())
          assert manifest['name'] == 'engineering-governance'
          assert manifest['version'] == '0.5.4'

          expected = {'project-governance', 'domain-navigation', 'incident-doctor'}
          actual = {p.name for p in Path('skills').iterdir() if p.is_dir()}
          assert actual == expected, (actual, expected)

          required = {
              'skills/project-governance/SKILL.md': 'Delivery / Semantic HEAD',
              'skills/project-governance/references/control-identity.md': 'CONTROL_ONLY_DRIFT',
              'skills/project-governance/references/verification-tiers.md': 'Repository-host gates are a separate live constraint.',
          }
          for path, needle in required.items():
              text = Path(path).read_text()
              assert needle in text, (path, needle)
          PY

      - name: Build exact Plugin payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          files = [Path('plugin.json')] + sorted(p for p in Path('skills').rglob('*') if p.is_file())
          assert len(files) == 29, len(files)

          with zipfile.ZipFile('engineering-governance-plugin.zip', 'w', compression=zipfile.ZIP_DEFLATED) as zf:
              for path in files:
                  zf.write(path, path.as_posix())

          with zipfile.ZipFile('engineering-governance-plugin.zip') as zf:
              names = zf.namelist()
              assert len(names) == 29, len(names)
              assert names[0] == 'plugin.json'
              assert all(n == 'plugin.json' or n.startswith('skills/') for n in names)
          PY

          sha256sum engineering-governance-plugin.zip | tee release.sha256
          wc -c < engineering-governance-plugin.zip | tr -d ' ' | tee release.size

      - name: Create immutable tag and GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='plugin-v0.5.4'

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            REMOTE_TAG_SHA="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
            if [ "${REMOTE_TAG_SHA}" != "${GITHUB_SHA}" ]; then
              echo "Tag ${TAG} already exists at ${REMOTE_TAG_SHA}; refusing to move release identity from ${GITHUB_SHA}."
              exit 1
            fi
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag "${TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${TAG}"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refusing duplicate publication."
            exit 1
          fi

          SIZE="$(cat release.size)"
          SHA256="$(cut -d' ' -f1 release.sha256)"

          cat > release-notes.txt <<EOF
          Engineering Governance Plugin v0.5.4

          Package version: 0.5.4

          Source SHA:
          ${GITHUB_SHA}

          Asset:
          engineering-governance-plugin.zip

          Size (bytes):
          ${SIZE}

          SHA-256:
          ${SHA256}

          Package file entries:
          29

          Included Skills:
          - project-governance
          - domain-navigation
          - incident-doctor

          Changes since v0.5.3:
          - distinguish literal Repository HEAD from Delivery / Semantic HEAD
          - classify CURRENT_STATUS.md / CURRENT_TASK.md-only movement as CONTROL_ONLY_DRIFT
          - preserve valid semantic implementation evidence across proven control-only drift when task conditions permit
          - keep repository-host checks, reviews, mergeability, queue state, and current-base/latest-head requirements as separate live literal constraints
          - align personal Codex distribution on a Git-backed engineering-governance-personal marketplace without adding a fourth Skill or runtime machinery

          The release asset contains only plugin.json and skills/**. Repository controls, docs, marketplace catalogs, and workflows are not packaged into the Plugin ZIP.
          EOF

          gh release create "${TAG}" engineering-governance-plugin.zip \
            --verify-tag \
            --title 'Engineering Governance Plugin v0.5.4' \
            --notes-file release-notes.txt
