name: Release Plugin v0.7.2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-plugin-v0.7.2.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('plugin.json').read_text())
          assert manifest['name'] == 'engineering-governance'
          assert manifest['version'] == '0.7.2'

          expected = {
              'project-governance',
              'project-profile',
              'solution-design',
              'design',
              'execution-orchestrator',
              'agent-handoff',
              'evidence-audit',
              'domain-navigation',
              'incident-doctor',
          }
          actual = {p.name for p in Path('skills').iterdir() if p.is_dir()}
          assert actual == expected, (actual, expected)

          for skill in sorted(expected):
              path = Path('skills') / skill / 'SKILL.md'
              assert path.is_file(), path

          orchestrator = Path('skills/execution-orchestrator/SKILL.md').read_text()
          for token in (
              'SUBAGENT_DECISION: USE | DO_NOT_USE',
              'EXPLORER',
              'WORKER',
              'VERIFIER',
              'REVIEWER',
          ):
              assert token in orchestrator, token

          subagent = Path('skills/execution-orchestrator/references/subagent-execution.md')
          assert subagent.is_file(), subagent
          subagent_text = subagent.read_text()
          assert 'SUBAGENT_MODEL_POLICY: ENVIRONMENT_DEFAULT_ONLY' in subagent_text
          assert 'MODEL_EFFECTIVE' in subagent_text
          assert 'REASONING_EFFECTIVE' in subagent_text

          governance = Path('skills/project-governance/SKILL.md').read_text()
          for token in ('Execution topology:', 'Subagents:', 'Subagent runtime:'):
              assert token in governance, token

          handoff = Path('skills/agent-handoff/references/handoff-contract.md').read_text()
          for token in ('EXECUTION_TOPOLOGY', 'SUBAGENTS', 'SUBAGENT_RUNTIME'):
              assert token in handoff, token
          PY

      - name: Build exact Plugin payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          files = [Path('plugin.json')] + sorted(
              p for p in Path('skills').rglob('*') if p.is_file()
          )

          with zipfile.ZipFile('engineering-governance-plugin.zip', 'w', compression=zipfile.ZIP_DEFLATED) as zf:
              for path in files:
                  zf.write(path, path.as_posix())

          with zipfile.ZipFile('engineering-governance-plugin.zip') as zf:
              names = zf.namelist()
              assert len(names) == len(files), (len(names), len(files))
              assert names[0] == 'plugin.json'
              assert all(n == 'plugin.json' or n.startswith('skills/') for n in names)
              assert not any(n.startswith('.codex-plugin/') for n in names)

          Path('release.entries').write_text(str(len(files)))
          PY

          sha256sum engineering-governance-plugin.zip | tee release.sha256
          wc -c < engineering-governance-plugin.zip | tr -d ' ' | tee release.size

      - name: Create immutable tag and GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='plugin-v0.7.2'

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            REMOTE_TAG_SHA="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
            if [ "${REMOTE_TAG_SHA}" != "${GITHUB_SHA}" ]; then
              echo "Tag ${TAG} already exists at ${REMOTE_TAG_SHA}; refusing to move release identity from ${GITHUB_SHA}."
              exit 1
            fi
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag "${TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${TAG}"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refusing duplicate publication."
            exit 1
          fi

          SIZE="$(cat release.size)"
          SHA256="$(cut -d' ' -f1 release.sha256)"
          ENTRIES="$(cat release.entries)"

          cat > release-notes.txt <<EOF
          Engineering Governance Plugin v0.7.2

          Package version: 0.7.2

          Publication source SHA:
          ${GITHUB_SHA}

          Accepted semantic candidate:
          23b05c7f8847dd1868f05dd3fe5257aed94f635a

          Asset:
          engineering-governance-plugin.zip

          Size (bytes):
          ${SIZE}

          SHA-256:
          ${SHA256}

          Package file entries:
          ${ENTRIES}

          Included Skills: exactly 9.

          v0.7.2 execution hardening:
          - make Sub Agents an efficiency mechanism rather than a completion requirement
          - add an explicit USE / DO_NOT_USE Sub Agent value gate
          - define EXPLORER / WORKER / VERIFIER / REVIEWER execution roles
          - preserve one-writer safety for overlapping semantic authority
          - keep concrete Sub Agent model/reasoning resolution environment-owned
          - separate configured/default model evidence from observed effective runtime identity
          - expose execution topology, Sub Agent usage and runtime evidence in Project Governance and Handoff receipts
          - preserve selective nine-Skill routing rather than an all-Skill pipeline
          - validate Local Sub Agent runtime and remaining nine-Skill routing before formal publication

          Distribution note:
          Local Git-backed and account-synced Plugin installations are intentional distribution projections of this repository source. Runtime cache-path selection is not semantic authority; version/content equivalence is the release requirement.

          The release asset contains only plugin.json and skills/**. Repository controls, root references, marketplace catalogs and workflows are not packaged into the Plugin ZIP.
          EOF

          gh release create "${TAG}" engineering-governance-plugin.zip \
            --verify-tag \
            --title 'Engineering Governance Plugin v0.7.2' \
            --notes-file release-notes.txt
